name: Build Capacitor Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies and build web app
        run: |
          npm ci || npm install
          npm run build

      - name: Setup Capacitor Android if missing
        run: |
          WEB_DIR="dist"
          if [ -d "build" ] && [ ! -d "dist" ]; then
            WEB_DIR="build"
          fi

          if [ ! -d "android" ]; then
            npm install @capacitor/core @capacitor/cli @capacitor/android
            npx cap init "Sport Timer" "com.remontnikdnepr.sporttimer" --web-dir="$WEB_DIR"
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: capacitor-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
